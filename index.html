/* ══ PALETTE BANKS ═══════════════════════════════════════════════════
   Art is drawn with 4 indices (0 darkest .. 3 lightest), exactly like
   the DMG. Each draw call selects a bank, which maps those 4 indices to
   real colours. This is how the Game Boy Color did it, and it means the
   whole tile and sprite library gets colour with no repainting.
   ═══════════════════════════════════════════════════════════════════ */
const BANK={};
let _pi=0;
function bank(name,c0,c1,c2,c3){ BANK[name]=_pi++; PALS.push([c0,c1,c2,c3]); return BANK[name]; }
const PALS=[];

/* environment */

let curPal=BANK.ui;
function usePal(p){ curPal=(typeof p==="string")?BANK[p]:p; }

const img=ctx.createImageData(W,H);
const buf=new Uint8Array(W*H);   // (palette<<2)|colorIndex

function clear(c,p){ buf.fill((((p===undefined?curPal:(typeof p==="string"?BANK[p]:p)))<<2)|c); }
function px(x,y,c){ x|=0; y|=0; if(x<0||y<0||x>=W||y>=H)return; buf[y*W+x]=(curPal<<2)|c; }
function rect(x,y,w,h,c){ for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c); }
function frame(x,y,w,h,c){ rect(x,y,w,1,c);rect(x,y+h-1,w,1,c);rect(x,y,1,h,c);rect(x+w-1,y,1,h,c); }

const RGB=[];
function bakePalettes(){
  RGB.length=0;
  for(const p of PALS){
    const row=[];
    for(const hex of p) row.push([parseInt(hex.substr(1,2),16),
                                  parseInt(hex.substr(3,2),16),
                                  parseInt(hex.substr(5,2),16)]);
    RGB.push(row);
  }
}
function flush(){
  if(!RGB.length) bakePalettes();
  const d=img.data;
  for(let i=0;i<buf.length;i++){
    const b=buf[i], c=RGB[b>>2][b&3], o=i*4;
    d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
  }
  ctx.putImageData(img,0,0);
}

function chw(ch){ return 6; }
function text(s,x,y,c){
  c=(c===undefined)?0:c;
  let cx=x;
  for(const ch of String(s)){
    const g=F[ch]||F["?"];
    for(let j=0;j<7;j++) for(let i=0;i<5;i++) if(g[j][i]==="#") px(cx+i,y+j,c);
    cx+=6;
  }
  return cx;
}
function textw(s){ return String(s).length*6; }
function wrap(s,maxCh){
  const out=[];
  for(const para of String(s).split("\n")){
    let ln="";
    for(const w of para.split(" ")){
      if(ln && (ln+" "+w).length>maxCh){ out.push(ln); ln=w; }
      else ln = ln?ln+" "+w:w;
    }
    out.push(ln);
  }
  return out;
}
function ctext(s,y,c,x0,w0){
  x0=x0===undefined?0:x0; w0=w0===undefined?W:w0;
  text(s, x0+Math.floor((w0-textw(s))/2), y, c);
}

/* ── Art: 16x16 tiles. ' '=3 light, '.'=2, ':'=1, '#'=0 dark, 't'=clear ── */
const CMAP={" ":3,".":2,":":1,"#":0,"t":-1};
function art(rows){ return rows.map(r=>[...r].map(c=>CMAP[c])); }

const TILE={};

function drawMon(name,x,y,scale,pal){
  const a=MON[name]; if(!a)return; scale=scale||2;
  usePal(pal||MONPAL[name]||"ui");
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){

}

    lesson:"Amber usually means the monitor has power but no signal. Check the input source before anything else - a monitor set to HDMI with the cable in DisplayPort is the single most common false hardware failure. Then reseat both ends, then test a known-good cable.",
    tip:"Amber light = signal problem. Green and black = the PC."},
  LOCKOUT:{name:"LOCKOUT",spr:"ACCOUNT",pal:"SECURITY",hp:32,atk:9,weak:"SECURITY",sla:6,act:1,account:true,
    cat:"Account", user:"\"I need my password reset, I'm late for a meeting.\"",
    intro:"Locked out after three attempts. They are in a hurry and they are annoyed.",
    lesson:"Urgency is the oldest lever in social engineering. Verify identity before any account change, every time, including when the caller is senior to you and especially when they are impatient. Use the approved method - callback to the number on record, or the identity questions your org defines. Note in the ticket which method you used.",
    tip:"Verify first. An angry user is not proof of identity."},
  CRAWLING:{name:"CRAWLING",spr:"PERF",pal:"SOFTWARE",hp:29,atk:8,weak:"SOFTWARE",sla:8,act:1,
    cat:"Performance", user:"\"My computer is slow.\"",
    intro:"Vague, universal, and usually four separate problems wearing a coat.",
    lesson:"\"Slow\" is not a symptom, it is a category. Narrow it: slow to boot, slow to open one app, or slow all day? Check uptime - a machine up for forty days has not had a patch reboot. Then startup apps, then disk space under 10 percent free, then resource usage while it is actually slow.",
    tip:"Ask when it is slow. The answer picks the fix."},
  SPOOLER:{name:"SPOOLER",spr:"PRINTER",pal:"boss",hp:50,atk:9,weak:"SOFTWARE",sla:11,act:1,boss:true,
    cat:"Printing", user:"\"Nothing prints. The whole floor.\"",
    intro:"Nine tickets in eleven minutes. All printing. All the same floor.",
    lesson:"Multiple users, one service - that is not nine tickets, it is one incident with nine reporters. Link them. For print: clear the queue, restart the spooler service, confirm the printer is not in an error or offline state, check the driver on the print server rather than each desktop. Fixing the server fixes all nine.",
    tip:"Same symptom, many users? Stop and look upstream."},

  /* ── ACT 2 · THE INBOX ── */
  LOOKALIKE:{name:"LOOKALIKE",spr:"PHISH",pal:"threat",hp:32,atk:10,weak:"SECURITY",sla:6,act:2,
    cat:"Phishing", user:"\"Is this email real? It looks like our vendor.\"",
    intro:"From the finance vendor. Almost. The domain is one character out.",
    lesson:"Look at the actual sending address, not the display name - display names are free to set. Watch for character substitution: rn for m, l for I, a hyphen added, a .co where .com should be. Hover links and read the real destination. Report through your phishing button so the whole tenant gets protected, not just this user.",
    tip:"Read the domain character by character. Out loud if you have to."},
  GIFTCARD:{name:"GIFTCARD",spr:"BEC",pal:"threat",hp:34,atk:11,weak:"SECURITY",sla:5,act:2,
    cat:"Social eng.", user:"\"The director needs gift cards for a client thing. Urgent.\"",
    intro:"Urgency, secrecy, a request outside normal process, and a sender who cannot take a call.",
    lesson:"Business email compromise runs on three signals together: unusual request, artificial urgency, and a reason you cannot verify through the normal channel. Any one is odd. All three is an attack. Verify out of band - call the person on their known number. Never reply to the email to check; you are just asking the attacker if they are real.",
    tip:"Out of band verification. Reply-to is the attacker's field."},
  PUSHSTORM:{name:"PUSHSTORM",spr:"MFA",pal:"threat",hp:36,atk:12,weak:"SECURITY",sla:4,act:2,account:true,
    cat:"MFA", user:"\"My phone keeps buzzing. I hit approve to make it stop.\"",
    intro:"Forty MFA prompts overnight. They approved one at 3am.",
    lesson:"MFA fatigue: the attacker already has the password and is spamming push prompts until someone taps approve. If a user reports unexpected prompts, treat the account as compromised - reset the password, revoke active sessions and tokens, re-enroll MFA, then check sign-in logs for where it came from. Number matching prevents the whole class of attack.",
    tip:"Unexpected prompts mean the password is already gone."},
  CALLBACK:{name:"CALLBACK",spr:"ACCOUNT",pal:"threat",hp:35,atk:11,weak:"SECURITY",sla:5,act:2,account:true,
    cat:"Vishing", user:"\"This is the VP's assistant. He needs access restored now.\"",
    intro:"A confident voice, a name you recognise, and a number you do not.",
    lesson:"Voice phishing borrows authority you cannot see. The caller ID is spoofable and the name is public on LinkedIn. Hang up and call back on the number in the directory - not the number they give you. A legitimate caller will not object to being verified. Someone who escalates to anger when asked to verify has told you what they are.",
    tip:"Call back on the number you looked up, not the one you were given."},
  SPEARPHISH:{name:"SPEARPHISH",spr:"SPEAR",pal:"boss",hp:64,atk:13,weak:"SECURITY",sla:8,act:2,boss:true,account:true,
    cat:"Spear phishing", user:"\"It knew my manager's name and our project.\"",
    intro:"Not a spray. Someone did homework. It names a real project and a real person.",
    lesson:"Spear phishing is researched, so the usual tells - bad grammar, generic greeting - are gone. What remains is the ask: credentials, payment, or a file. Check the sending domain, check whether the link destination matches the text, and verify the request out of band. Then hunt: search the tenant for who else received it and pull it before they open it.",
    tip:"When the content is convincing, judge the request, not the writing."},

  /* ── ACT 3 · THE CLOSET ── */
  GHOSTDOCK:{name:"GHOSTDOCK",spr:"DOCK",pal:"HARDWARE",hp:36,atk:11,weak:"HARDWARE",sla:7,act:3,
    cat:"Docking", user:"\"Second screen only works sometimes.\"",
    intro:"Works at one desk, not at another. Same laptop, same user.",
    lesson:"Docks fail intermittently more than they fail outright. Test the variables separately: laptop to monitor direct rules out the dock, a different dock rules out that unit, a different port rules out the port. Dock firmware is a real and frequently missed fix. Daisy-chained DisplayPort needs MST enabled on the monitor.",
    tip:"Direct connection first. It splits the problem in half."},
  BADSTICK:{name:"BADSTICK",spr:"HWFAIL",pal:"HARDWARE",hp:34,atk:12,weak:"HARDWARE",sla:8,act:3,
    cat:"Hardware fault", user:"\"It keeps crashing. Blue screen.\"",
    intro:"Random crashes, no pattern, different error codes each time.",
    lesson:"Different stop codes each crash points at memory or storage rather than a driver - a bad driver tends to fail the same way twice. Run the built-in memory diagnostic, then check drive health. If there are multiple sticks, test one at a time; substitution is the proof. Reseating alone fixes a surprising share of them.",
    tip:"Same error twice is software. Different errors is hardware."},
  DRIVERROT:{name:"DRIVERROT",spr:"PROCESS",pal:"SOFTWARE",hp:31,atk:10,weak:"SOFTWARE",sla:7,act:3,
    cat:"Drivers", user:"\"It broke right after the update.\"",
    intro:"Worked yesterday. Updated overnight. Does not work today.",
    lesson:"\"What changed?\" is the highest-value question on the desk. If a device broke immediately after an update, roll the driver back before anything else - the rollback button exists precisely for this. Then pin the version or block the update for that device class until the vendor ships a fix, and note it so the next person does not reinstall the bad one.",
    tip:"Ask what changed. Then undo that thing."},
  IMAGEFAIL:{name:"IMAGEFAIL",spr:"HWFAIL",pal:"SOFTWARE",hp:33,atk:11,weak:"HARDWARE",sla:9,act:3,
    cat:"Deployment", user:"\"The new machine won't image.\"",
    intro:"It gets to the boot menu and then nothing.",
    lesson:"Network boot needs three things right: the NIC first in boot order, the machine on a VLAN that can reach the deployment server, and Secure Boot in the state your image expects. Wrong VLAN is the quiet one - the machine looks fine and simply never finds the server. Check the switch port before you blame the image.",
    tip:"PXE failures are usually the network, not the image."},
  FLEETDOWN:{name:"FLEETDOWN",spr:"DOCK",pal:"boss",hp:66,atk:13,weak:"HARDWARE",sla:10,act:3,boss:true,
    cat:"Fleet incident", user:"\"Every dock on the third floor.\"",
    intro:"Eleven desks. Same model dock. All after Tuesday's firmware push.",
    lesson:"When one model fails everywhere at once, the change is the cause. Find what shipped and when, confirm the correlation, then roll it back for the affected group rather than fixing eleven desks by hand. Log it as one incident with eleven affected users. This is where a good ticket note becomes a vendor case number.",
    tip:"One model, one timeframe, one cause. Look at the change log."},

  /* ── ACT 4 · THE WIRE ── */
  APIPA:{name:"APIPA",spr:"NETFAIL",pal:"NETWORK",hp:34,atk:11,weak:"NETWORK",sla:6,act:4,
    cat:"DHCP", user:"\"No internet on this one machine.\"",
    intro:"Link light is on. The address starts 169.254.",
    lesson:"A 169.254.x.x address is APIPA - the machine asked for DHCP and nothing answered. That is not an internet problem, it is a lease problem. Release and renew first. If it comes back APIPA, the fault is upstream: the switch port, the VLAN, or a DHCP scope that has run out of addresses. One machine points at the port; the whole floor points at the scope.",
    tip:"169.254 means DHCP never answered. Look at the port."},
  DNSDEAD:{name:"DNSDEAD",spr:"NETFAIL",pal:"NETWORK",hp:36,atk:12,weak:"NETWORK",sla:6,act:4,
    cat:"DNS", user:"\"Websites don't load but Teams works.\"",
    intro:"Some things work. Some things do not. That pattern is the clue.",
    lesson:"If an IP address works and the name does not, it is DNS. Test it: ping the gateway, then ping a public IP, then resolve a name. Flush the resolver cache, confirm the machine has the right DNS servers, and check whether it is one host or everyone. Applications that hold their own connection can keep working through a DNS outage, which is why the symptoms look inconsistent.",
    tip:"IP works, name doesn't. That is DNS, every time."},
  TUNNELVISION:{name:"TUNNELVISION",spr:"PACKET",pal:"NETWORK",hp:35,atk:11,weak:"NETWORK",sla:7,act:4,
    cat:"VPN", user:"\"On VPN I can't reach the file share.\"",
    intro:"Connected, authenticated, and still cannot see internal resources.",
    lesson:"A VPN that connects but reaches nothing is usually routing, not authentication. Check whether split tunnelling is sending internal traffic out the wrong path, whether the client got internal DNS servers, and whether the resource is in a range the tunnel actually routes. Overlapping home and corporate subnets breaks this in a way that looks random.",
    tip:"Connected is not the same as routed."},
  WRONGVLAN:{name:"WRONGVLAN",spr:"PACKET",pal:"NETWORK",hp:33,atk:10,weak:"NETWORK",sla:8,act:4,oos:true,
    cat:"Switching", user:"\"This desk has never worked.\"",
    intro:"New desk, new drop. Link light, no address, no route anywhere.",
    lesson:"A port on the wrong VLAN behaves like a broken cable that tests fine. You can prove it - known-good cable, known-good laptop, still nothing - but changing switch configuration is not a Tier 1 action in most orgs. Document the port number, the patch panel location and what you ruled out, then escalate to networking. That handoff note is the whole job here.",
    tip:"Prove it, document the port, hand it over."},
  RESOLVER:{name:"RESOLVER",spr:"NETFAIL",pal:"boss",hp:70,atk:14,weak:"NETWORK",sla:10,act:4,boss:true,
    cat:"Major incident", user:"\"Everything is down.\"",
    intro:"Thirty tickets in four minutes. Every one of them different. Every one of them DNS.",
    lesson:"In a major incident your job changes. Stop solving and start collecting: what is the common factor, when did it start, who is affected, what changed. Post one status update so the queue stops growing. Feed structured facts to whoever owns the fix. The person who keeps a clean timeline during a P1 is the person everyone remembers afterwards.",
    tip:"During a P1, information flow is the deliverable."},

  /* ── ACT 5 · ESCALATION ── */
  MISPRIORITY:{name:"MISPRIORITY",spr:"PROCESS",pal:"PEOPLE",hp:34,atk:11,weak:"PEOPLE",sla:6,act:5,
    cat:"Prioritisation", user:"\"Mine is urgent too.\"",
    intro:"Four P1s in the queue. Two of them are not P1s.",
    lesson:"Priority is impact times urgency, not volume of complaint. One executive with a broken mouse is low impact. Forty people who cannot log in is high impact even if nobody has phoned yet. Set priority from the matrix your org publishes and record why, because the reason is what protects you when someone disagrees later.",
    tip:"Impact times urgency. Not who shouted loudest."},
  NOCHANGE:{name:"NOCHANGE",spr:"PROCESS",pal:"PEOPLE",hp:36,atk:12,weak:"PEOPLE",sla:7,act:5,oos:true,
    cat:"Change control", user:"\"Just push it now, it's a small change.\"",
    intro:"A production change with no ticket, no approval and no rollback plan.",
    lesson:"Small changes cause large outages, which is the entire reason change control exists. If there is no approved change record and no rollback plan, the answer is not yes and it is not no - it is escalate to whoever owns the change process. Saying that clearly and without apology is a Tier 1 skill that reads as senior.",
    tip:"No approval, no rollback plan, no deployment."},
  SLACLOCK:{name:"SLACLOCK",spr:"PERF",pal:"PEOPLE",hp:35,atk:12,weak:"PEOPLE",sla:5,act:5,
    cat:"SLA", user:"(no contact - the timer is at nine minutes)",
    intro:"An untouched ticket about to breach while you are mid-call on another.",
    lesson:"A breach you saw coming and communicated is a very different conversation from a breach that surprised everyone. Update the ticket before the clock runs out, even if the update is only that you are still working it. Silence is what turns a late ticket into a complaint.",
    tip:"Update before it breaches. Silence is the real failure."},
  HANDOFF:{name:"HANDOFF",spr:"DOCUMENT",pal:"PEOPLE",hp:33,atk:10,weak:"PEOPLE",sla:8,act:5,
    cat:"Documentation", user:"\"There's nothing in the notes.\"",
    intro:"Inherited at shift change. Three days old. Six words in the log.",
    lesson:"Write for the person who picks this up at 2am with no context: what the user reported, what you observed, what you tried, what the result was, what is next. Timestamps on each. It takes ninety seconds and it is the difference between a handoff and a restart.",
    tip:"Observed, tried, result, next. Four lines, every time."},
  SEVONE:{name:"SEVONE",spr:"MAJOR",pal:"boss",hp:76,atk:15,weak:"PEOPLE",sla:12,act:5,boss:true,
    cat:"Major incident", user:"\"Bridge call. Now.\"",
    intro:"Payroll, on payroll day, ninety minutes before cutoff. Everyone is on the call and nobody has the facts.",
    lesson:"On a bridge call, the useful person is the one with a timeline. First report at this time, this many affected, this changed beforehand, this has been ruled out. Do not speculate about cause on an open call. Take the notes nobody else is taking, keep the status page current, and hand a clean summary to the post-incident review.",
    tip:"Facts, timeline, no speculation. Be the one taking notes."}

/* ══ AUDIO ══════════════════════════════════════════════════════════
   Two pulse voices, a triangle bass and a noise channel, which is
   roughly the Game Boy's voice allocation. Everything is synthesised
   at runtime; there are no audio files to load or host.
   ═══════════════════════════════════════════════════════════════════ */
const SND={ctx:null, master:null, on:true, ready:false,
  track:null, next:0, step:0, timer:null};

/* Must be called from inside a real user-gesture handler. Browsers create
   the context in "suspended" state otherwise and it never starts. */
function audioInit(){
  try{
    if(!SND.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC){ SND.blocked="no Web Audio in this browser"; return; }
      SND.ctx=new AC();
      SND.master=SND.ctx.createGain();
      SND.master.gain.value=SND.on?0.16:0;
      SND.master.connect(SND.ctx.destination);
      // silent one-sample buffer: unlocks output on iOS Safari
      const b=SND.ctx.createBuffer(1,1,22050);
      const src=SND.ctx.createBufferSource();
      src.buffer=b; src.connect(SND.ctx.destination); src.start(0);
    }
    if(SND.ctx.state!=="running"){
      const p=SND.ctx.resume();
      if(p&&p.then) p.then(()=>{ SND.ready=true; drain(); });
    }
    if(SND.ctx.state==="running"||SND.ctx.state===undefined){ SND.ready=true; drain(); }
  }catch(e){ SND.blocked=String(e&&e.message||e); }
}
function drain(){
  if(!SND.timer) SND.timer=setInterval(schedule,25);
  if(SND.pending){ const t=SND.pending; SND.pending=null; music(t); }
}
function audioState(){
  if(SND.blocked) return "BLOCKED";
  if(!SND.ctx) return "OFF";
  if(SND.ctx.state!=="running") return "OFF";
  return SND.on?"ON":"MUTED";
}
function audioToggle(){
  SND.on=!SND.on;
  if(SND.master&&SND.ctx) SND.master.gain.setTargetAtTime(SND.on?0.16:0, SND.ctx.currentTime, 0.02);
  return SND.on;
}
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

/* one pulse/triangle note */
function tone(midi,t0,dur,wave,vol,slide){
  if(!SND.ready) return;
  const c=SND.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=wave||"square";
  const f=mtof(midi);
  o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(mtof(midi+slide), t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(SND.master);
  o.start(t0); o.stop(t0+dur+0.02);
}
/* noise burst for percussion and impacts */
function noise(t0,dur,vol,hp){
  if(!SND.ready) return;
  const c=SND.ctx, n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,Math.max(1,n),c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const g=c.createGain(); g.gain.value=vol||0.1;
  const f=c.createBiquadFilter(); f.type=hp?"highpass":"lowpass"; f.frequency.value=hp||2200;
  src.connect(f); f.connect(g); g.connect(SND.master);
  src.start(t0); src.stop(t0+dur+0.02);
}

let _queued=null;
function music(name){
  if(!SND.ready||!SND.ctx||SND.ctx.state!=="running"){ SND.pending=name; return; }
  if(SND.trackName===name) return;
  SND.trackName=name;
  SND.track=TRACKS[name]||null;
  SND.step=0;
  SND.next=SND.ctx.currentTime+0.06;
  if(!SND.timer) SND.timer=setInterval(schedule,25);
}
function schedule(){
  if(!SND.ready||!SND.on||!SND.track) return;
  const t=SND.track, spb=60/t.bpm/4;          // sixteenth notes
  const horizon=SND.ctx.currentTime+0.14;
  while(SND.next<horizon){
    const s=SND.step % t.ch[0].n.length;
    for(const c of t.ch){
      const v=c.n[s];
      if(!v) continue;
      if(c.w==="noise") noise(SND.next,0.045,c.v,4000);
      else tone(v,SND.next,spb*(c.w==="triangle"?1.6:1.25),c.w,c.v);
    }
    SND.next+=spb; SND.step++;
    if(t.loop===false && SND.step>=t.ch[0].n.length){
      SND.trackName=null; SND.track=null;
      if(_queued){ const q=_queued; _queued=null; setTimeout(()=>music(q),20); }
      break;
    }
  }
}
function musicThen(short,back){ _queued=back; music(short); }

    const before=S.msg.ch;
    S.msg.ch+= keys.ok?3:1;
    if(S.msg.ch>before) sfx("text");
    if(S.msg.ch>=total){S.msg.ch=total;S.msg.done=true;}
  } else if(hit("ok")||hit("back")){
    sfx("page");
    S.msg.i++; S.msg.ch=0; S.msg.done=false;
    if(S.msg.i>=S.msg.pages.length){
      const cb=S.msg.onDone; S.msg=null; S.scene="world";
      if(cb) cb();
    }
  }
}
function story(cards,onDone){
  music("story");
  const pages=[];
  for(const c of cards){
    const avail=c.title?96:104;      // pixels between header and footer rule
    let cur=[], h=0, first=true;
    for(const raw of c.lines){
      const chunk = raw==="" ? [""] : wrap(raw,24);
      for(const ln of chunk){
        const lh = ln==="" ? 6 : 11;
        if(h+lh>avail && cur.length){
          pages.push({title:first?c.title:null,pal:c.pal,lines:cur});
          cur=[]; h=0; first=false;
          if(ln==="") continue;      // don't lead a page with a blank
        }
        cur.push(ln); h+=lh;
      }
    }
    if(cur.length) pages.push({title:first?c.title:null,pal:c.pal,lines:cur});
    // orphan control: never end a card on a single dangling line
    if(pages.length>=2){
      const last=pages[pages.length-1], prev=pages[pages.length-2];
      if(last.lines.length===1 && prev.lines.length>3 && prev.pal===last.pal){
        last.lines.unshift(prev.lines.pop());
        if(prev.lines[prev.lines.length-1]==="") prev.lines.pop();
      }
    }
  }
  S.cut={cards:pages,i:0,ch:0,done:false,onDone:onDone||null};
  S.scene="story"; clearPressed();
}
function cutLines(c){ return c.lines; }
function drawStory(){
  const c=S.cut.cards[S.cut.i];
  clear(0,c.pal||"ui");
  usePal(c.pal||"ui");
  rect(0,0,W,3,1); rect(0,H-3,W,3,1);
  for(let i=0;i<W;i+=4) px(i,6,1);
  for(let i=0;i<W;i+=4) px(i,H-7,1);
  if(c.title){ rect(6,12,textw(c.title)+8,12,1); text(c.title,10,15,3); }
  let shown=S.cut.ch, y=c.title?32:26;
  for(const ln of c.lines){
    if(ln===""){ y+=6; continue; }
    text(ln.substring(0,Math.max(0,shown)),10,y,3);
    shown-=ln.length; y+=11;
    if(shown<=0) break;
  }
  if(S.cut.done&&(S.tick>>4)%2===0){ rect(146,H-14,5,4,3); rect(147,H-10,3,1,3); }
}
function updStory(){
  const c=S.cut.cards[S.cut.i];
  const total=c.lines.join("").length;
  if(!S.cut.done){
    const b4=S.cut.ch;
    S.cut.ch+=keys.ok?4:1;
    if(S.cut.ch>b4) sfx("text");
    if(S.cut.ch>=total){S.cut.ch=total;S.cut.done=true;}
  } else if(hit("ok")||hit("back")){
    sfx("page");
    S.cut.i++; S.cut.ch=0; S.cut.done=false;
    if(S.cut.i>=S.cut.cards.length){
      const cb=S.cut.onDone; S.cut=null; S.scene="world"; music("world");
      if(cb) cb();
    }
  }
}
function unlock(key){
  if(!JOURNAL.some(j=>j.key===key)) return;
  if(!S.journal.includes(key)) S.journal.push(key);
}
function beat(fid,then){
  const b=BEATS[fid];
  unlock(fid);
  if(!b){ if(then)then(); return; }
  story([{title:b.title,pal:b.pal,lines:b.lines}],then);
}
function notice(t){ S.notice=t; S.noticeT=110; }

/* ══ WORLD ══════════════════════════════════════════════════════════ */
function updWorld(){
  if(S.bumped>0)S.bumped--;
  if(hit("map")){ sfx("confirm"); S.mapFrom="world"; S.scene="map"; return; }
  if(hit("menu")){ sfx("confirm"); S.scene="menu"; S.menuIdx=0; return; }
  if(S.walking){
    S.step+=2; const d=S.step;
    if(S.dir==="up")S.oy=-d; if(S.dir==="down")S.oy=d;
    if(S.dir==="left")S.ox=-d; if(S.dir==="right")S.ox=d;
    S.anim=(S.step>4&&S.step<13)?1:0;
    if(S.step>=16){
      S.walking=false; S.step=0; S.ox=0; S.oy=0; S.anim=0;
      if(S.dir==="up")S.ty--; if(S.dir==="down")S.ty++;
      if(S.dir==="left")S.tx--; if(S.dir==="right")S.tx++;
      arrive();
    }
    return;
  }
  if(hit("ok")){ interact(); return; }
  let d=null;
  if(keys.up)d="up"; else if(keys.down)d="down";
  else if(keys.left)d="left"; else if(keys.right)d="right";
  if(d){
    S.dir=d;
    const n=step(S.tx,S.ty,d);
    if(!solidAt(n.x,n.y)) S.walking=true;
    else if(!S.bumped){ sfx("bump"); S.bumped=6; }
  }
}
function step(x,y,d){
  if(d==="up")return{x,y:y-1}; if(d==="down")return{x,y:y+1};
  if(d==="left")return{x:x-1,y}; return{x:x+1,y};
}
function arrive(){
  const m=mp();
  const dr=(m.doors||[]).find(d=>d.x===S.tx&&d.y===S.ty);
  if(dr){ sfx("door"); S.map=dr.to; S.tx=dr.tx; S.ty=dr.ty; S.seen[dr.to]=true; notice(MAPS[S.map].name); save(); return; }
  if(m.lift&&m.lift.x===S.tx&&m.lift.y===S.ty){ tryLift(); return; }
  const e=encAt(S.tx,S.ty);
  if(e){ sfx("encounter"); startTicket(e.f); }
}
function interact(){
  const n=step(S.tx,S.ty,S.dir);
  const npc=npcAt(n.x,n.y);
  if(npc){ talkTo(npc); return; }
  const t=TKEY[tileAt(n.x,n.y)];
  if(t==="term"){ termUse(); return; }
  else if(t==="board") say([["SHIFT BOARD","Observed, tried, result, next. Four lines on every ticket."]]);
  else if(t==="rack") say([["RACK","Patch panel, label maker, and three cables nobody will admit to."]]);
  else if(t==="cabinet") say([["SPARES","Known-good cables and a loaner dock. Substitution is proof."]]);
  else if(t==="boxes") say([["BOXES","New machines, still shrink-wrapped. None of them imaged yet."]]);
  else if(t==="desk") say([["DESK","Someone's lunch and a sticky note that just says DO NOT REBOOT."]]);
  else if(t==="lift") tryLift();
}
function talkTo(npc){
  npc.face=opposite(S.dir);
  if(npc.kind==="giver"&&!S.flags["gave_"+npc.gives]){
    const done=actTickets().filter(x=>S.cleared[x]).length;
    if(done<(npc.need||0)){ sfx("deny"); say(npc.locked||npc.lines); return; }
    say(npc.lines,()=>{
      S.flags["gave_"+npc.gives]=true;
      addSkill(npc.gives);
      const c=SKILLS[npc.gives];
      say([["",c.name+" learned!"],
           ["",c.name+" is a "+c.type+" skill. Tickets weak to "+TSHORT[c.type]+" take double."],
           ["",c.dex]]);
    });
    return;
  }
  if(npc.kind==="heal"&&S.party.length&&S.flags["met_"+npc.name]){
    const hurt=S.party.some(p=>p.hp<p.max);
    S.party.forEach(p=>p.hp=p.max);
    sfx("levelup");
    say(hurt?[["RENEE","Sit down. Water, then back at it."],["","Your SKILLS are back to full."]]
            :[["RENEE","You're fine. Queue's open."]]);
    return;
  }
  const met=npc.kind==="giver"?S.flags["gave_"+npc.gives]:S.flags["met_"+npc.name];
  S.flags["met_"+npc.name]=true;
  say(met&&npc.after?npc.after:npc.lines);
}
function opposite(d){ return {up:"down",down:"up",left:"right",right:"left"}[d]; }

function actDone(a){
  const A2=ACTS[a-1];
  return A2.tickets.every(t=>S.cleared[t]) && S.cleared[A2.boss];
}
function bossReady(){
  const A2=ACTS[actOf(S.map)-1];
  return A2.tickets.filter(t=>S.cleared[t]).length>=3 && !S.cleared[A2.boss];
}
function termUse(){
  const A2=ACTS[actOf(S.map)-1];
  const done=A2.tickets.filter(t=>S.cleared[t]).length;
  if(S.cleared[A2.boss]){ say([["QUEUE","Open on this floor: 0. Nice shift."]]); return; }
  if(done>=3){
    say([["QUEUE","A cluster just came in. Same symptom, many users."],
         ["QUEUE","That is not "+A2.tickets.length+" tickets. That is one incident."]],
        ()=>startTicket(A2.boss));
  } else {
    sfx("deny");
    say([["QUEUE","Open on this floor: "+(A2.tickets.length-done)+"."],
         ["QUEUE","Work "+(3-done)+" more before the cluster shows up."]]);
  }
}
function tryLift(){
  const cur=actOf(S.map);
  if(!actDone(cur)){
    sfx("deny");
    say([["LIFT","Floor "+ACTS[cur-1].floor+" is not clear yet."],
         ["LIFT","Close the queue and the incident, then ride up."]]);
    return;
  }
  if(cur>=5){
    if(S.flags.ending){ say([["LIFT","Shift complete. Press R for the resume."]]); return; }
    S.flags.ending=true; unlock("end");
    story(ENDING.map(c=>({pal:c.pal,lines:c.lines})),()=>{ S.scene="hof"; });
    return;
  }
  const nx=ACTS[cur];
  S.act=Math.max(S.act,cur+1);
  S.map=nx.map; const sp=MAPS[nx.map].spawn;
  S.tx=sp.x; S.ty=sp.y; S.dir=sp.dir; S.ox=0; S.oy=0;
  sfx("door"); notice(MAPS[S.map].name); save();
  say([["","FLOOR "+nx.floor+" - "+nx.name],["",nx.where+". "+nx.goal]]);
}

function addSkill(id){
  const c=SKILLS[id];
  S.party.push({id,name:c.name,type:c.type,lvl:1,hp:c.hp,max:c.hp,atk:c.atk,
    moves:c.moves.slice(),xp:0});
}
function alive(){ return S.party.filter(p=>p.hp>0); }
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }

function closeTicket(tid,rec){
  const t=TICKETS[tid];
  S.log.push({id:"T-"+String(S.log.length+1).padStart(3,"0"),
    ticket:t.name, cat:t.cat, act:t.act,
    turns:rec.turns, sla:rec.sla, fcr:rec.fcr, verified:rec.verified,
    escalated:rec.escalated, documented:rec.documented, when:today()});
  S.cleared[tid]=true;
  if(!S.dex.includes(tid)) S.dex.push(tid);
}
function metrics(){
  const n=S.log.length||1;
  return {
    closed:S.log.length,
    slaMet:Math.round(100*S.log.filter(l=>l.sla).length/n),
    fcr:Math.round(100*S.log.filter(l=>l.fcr).length/n),
    docd:Math.round(100*S.log.filter(l=>l.documented).length/n)
  };
}

/* ══ BATTLE ═════════════════════════════════════════════════════════
   The method is the mechanic. Ask builds detail; Isolate and Fix scale
   with it. Account tickets fail without Verify no matter what you do.
   Out-of-scope tickets are only closed by Escalate. The SLA clock runs
   the whole time.
   ═══════════════════════════════════════════════════════════════════ */
function startTicket(tid){
  if(!S.party.length){ say([["","You have no SKILLS yet. Talk to MARCUS on the floor."]]); return; }
  const t=TICKETS[tid];
  S.battle={tid,f:t,hp:t.hp,max:t.hp,atk:t.atk,info:0,verified:false,
    me:alive()[0],turns:0,sla:t.sla,escalated:false,documented:false,
    phase:"intro",menu:0,shake:0,flash:0};
  S.scene="battle"; clearPressed();
  music(t.boss?"boss":"battle");
  bmsg("TICKET "+t.name+" - "+t.cat+"\n"+t.user,()=>{
    bmsg(t.intro,()=>{ S.battle.phase="menu"; });
  });
}
function bmsg(t,then){ const b=S.battle; b.text=t; b.ch=0; b.tdone=false; b.then=then||null; b.phase="msg"; }

function doMove(mv){
  const b=S.battle, me=b.me, M=MOVES[mv], t=b.f;
  const weak=(me.type===t.weak);
  let d=0, lines=[];
  b.turns++;

  if(M.kind==="ask"){
    b.info++;
    d=M.pow;
    lines.push(me.name+" asked. Detail on hand: "+b.info+".");
    if(b.info===2) lines.push("Tip: "+t.tip);
  }
  else if(M.kind==="verify"){
    if(t.account){
      b.verified=true; d=M.pow+10;
      lines.push("Identity confirmed through the approved method.");
      lines.push("This ticket cannot be closed without it.");
    } else {
      d=2; lines.push("Verified - but this ticket touches no account. A turn spent.");
    }
  }
  else if(M.kind==="isolate"){
    d=M.pow+b.info*5;
    lines.push(b.info?me.name+" ruled causes out one at a time.":me.name+" changed something at random.");
    if(!b.info) lines.push("No detail gathered. Barely moved it.");
  }
  else if(M.kind==="fix"){
    if(b.info<2){ d=4; lines.push("Applied a fix on a guess. It made things worse."); me.hp=Math.max(1,me.hp-4); }
    else if(t.account&&!b.verified){ d=3; lines.push("Changed an account without verifying identity."); lines.push("The fix does not count."); }
    else { d=M.pow+b.info*3; lines.push(me.name+" applied the fix."); }
  }
  else if(M.kind==="escalate"){
    if(t.oos){ d=999; b.escalated=true;
      lines.push("Out of scope, and you proved it before handing over.");
      lines.push("Escalated with the port, the tests run and the result."); }
    else { d=3; b.atk+=1; lines.push("Escalated something you could have solved.");
           lines.push("Tier 2 sent it back. The clock kept running."); }
  }
  else if(M.kind==="document"){
    b.documented=true; d=M.pow+b.info*2;
    lines.push(me.name+" wrote it up: observed, tried, result, next.");
  }

  d=Math.round(d*(1+(me.lvl-1)*0.15));
  if(weak&&(M.kind==="isolate"||M.kind==="fix"||M.kind==="escalate")){ d=Math.round(d*2);
    lines.push("The right skill for this ticket."); }
  b.hp=Math.max(0,b.hp-d);
  b.flash=8;
  sfx(M.kind==="ask"?"collect":(weak?"crit":"hit"));

  bmsg(lines.join("\n"),()=>{
    if(b.hp<=0){ resolveTicket(); return; }
    if(b.turns>=b.sla+3){ breach(); return; }
    userTurn();
  });
}
function userTurn(){
  const b=S.battle, me=b.me;
  const left=b.sla-b.turns;
  if(left===1){ bmsg("SLA warning: one turn left on the clock.",()=>b.phase="menu"); return; }
  const d=Math.max(1,Math.round(b.atk*(0.8+Math.random()*0.5)));
  me.hp=Math.max(0,me.hp-d);
  b.shake=10; sfx("hurt");
  const flavour = left<=0 ? "The ticket has breached. The user is calling again."
                          : "The user follows up. The clock is running.";
  bmsg(flavour+"\n"+me.name+" took "+d+".",()=>{
    if(me.hp<=0){
      const rest=alive();
      if(rest.length){ sfx("faint"); b.me=rest[0]; bmsg(me.name+" is spent. "+rest[0].name+" takes over.",()=>b.phase="menu"); }
      else loseTicket();
    } else b.phase="menu";
  });
}
function breach(){
  const b=S.battle;
  sfx("deny");
  bmsg("SLA BREACHED. The ticket reassigns to Tier 2.",()=>loseTicket(true));
}
function resolveTicket(){
  const b=S.battle, t=b.f;
  const slaMet=b.turns<=b.sla;
  const fcr=(b.turns<=Math.ceil(b.sla*0.7))&&!b.escalated;
  b.me.xp+=10;
  let lvlup=false;
  if(b.me.xp>=20*b.me.lvl){ b.me.lvl++; b.me.max+=6; b.me.hp=b.me.max; b.me.atk+=2; lvlup=true;
    setTimeout(()=>sfx("levelup"),700); }
  closeTicket(b.tid,{turns:b.turns,sla:slaMet,fcr,verified:b.verified,
    escalated:b.escalated,documented:b.documented});
  musicThen("win","world"); sfx("logged");
  const q=[
    (slaMet?"Closed within SLA in "+b.turns+" turns.":"Closed, but the SLA was missed."),
    (b.documented?"Written up for the next shift.":"Closed with thin notes. The next person will pay for that."),
    "TICKETDEX updated: "+t.name+"."
  ];
  if(lvlup) q.push(b.me.name+" reached level "+b.me.lvl+".");
  b.phase="msg"; b.queue=q.slice(1);
  bmsg(q[0],()=>nextWinMsg());
}
function nextWinMsg(){
  const b=S.battle;
  if(b.queue&&b.queue.length){ bmsg(b.queue.shift(),()=>nextWinMsg()); return; }
  const tid=b.tid;
  S.battle=null; S.scene="world"; save();
  beat(tid,()=>afterBeat(tid));
}
function afterBeat(tid){
  const t=TICKETS[tid];
  if(t.boss){
    const act=ACTS[t.act-1];
    if(!S.badges.includes(act.badge)){
      S.badges.push(act.badge);
      say([["","BADGE GET: "+act.badge+"!"],
           ["","Floor "+act.floor+" cleared. The lift will take you up."]]);
    }
  }
}
function loseTicket(breached){
  const b=S.battle;
  sfx("faint"); music("world");
  const msg=breached?"Reassigned. It is out of your hands now."
                    :"You are out of road on this one. It goes back to the queue.";
  bmsg(msg,()=>{
    S.party.forEach(p=>p.hp=Math.max(1,Math.round(p.max*0.5)));
    S.battle=null; S.scene="world"; S.shift++;
    say([["","The ticket is still open."],
         ["","Tip: ASK twice before you FIX. Detail is what makes the fix land."]]);
  });
}

    else if(hit("ok")||hit("back")){ sfx("page"); const t=b.then; b.then=null; if(t)t(); else b.phase="menu"; }
    return;
  }
  if(b.phase==="intro"){ b.phase="menu"; return; }
  const m0=b.menu;
  if(hit("up"))b.menu=(b.menu+3)%4;
  if(hit("down"))b.menu=(b.menu+1)%4;
  if(hit("left"))b.menu=(b.menu+3)%4;
  if(hit("right"))b.menu=(b.menu+1)%4;
  if(b.menu>=b.me.moves.length)b.menu=0;
  if(b.menu!==m0) sfx("cursor");
  if(hit("ok")){ sfx("confirm"); doMove(b.me.moves[b.menu]); }
}

    case "title": updTitle(); break;

    case "dialog": updMsg(); break;
    case "story": updStory(); break;
    case "menu": updMenu(); break;
    case "battle": updBattle(); break;
    case "map": updMap(); break;
    case "dex": updDex(); break;
    case "dexentry": updDexEntry(); break;
    case "skills": updSkills(); break;
    case "badges": updBadges(); break;
    case "metrics": updMetrics(); break;
    case "hof": updHof(); break;
    case "journal": updJournal(); break;
  }
  clearPressed();
}

  switch(S.scene){
    case "title": drawTitle(); break;

    case "skills": drawSkills(); break;
    case "badges": drawBadges(); break;
    case "metrics": drawMetrics(); break;
    case "hof": drawHof(); break;
    case "journal": drawJournal(); break;
  }
  flush();
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }

/* ── viewport: fill the window, letterboxed ── */
function fit(){
  const coarse = matchMedia("(pointer:coarse)").matches;
  const availW = window.innerWidth - (coarse?16:48);
  const availH = window.innerHeight - (coarse?16:76);
  const raw = Math.min(availW/W, availH/H);
  const sc = raw>=2 ? Math.floor(raw) : Math.max(1,raw);
  cvs.style.width = Math.round(W*sc)+"px";
  cvs.style.height = Math.round(H*sc)+"px";
}
addEventListener("resize",fit);
addEventListener("orientationchange",()=>setTimeout(fit,120));
fit();

const crtEl=document.getElementById("crt");
function toggleCrt(){ crtEl.classList.toggle("off"); }
function toggleFs(){
  const el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
  else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
  setTimeout(fit,180);
}
document.getElementById("btnCrt").onclick=toggleCrt;
document.getElementById("btnFs").onclick=toggleFs;
document.addEventListener("fullscreenchange",()=>setTimeout(fit,180));

    if(e.key==="Escape"||e.key.toLowerCase()==="r"){ e.preventDefault(); closeSheet(); }
    return;
  }
  const k=e.key.toLowerCase();
  if(k==="f"){ e.preventDefault(); toggleFs(); }
  if(k==="c"){ e.preventDefault(); toggleCrt(); }
  if(k==="r"){ e.preventDefault(); openSheet(); }
});

/* ── touch controls ── */
(function(){
  document.querySelectorAll("#touch i").forEach(el=>{
    const k=el.dataset.k;
    const down=e=>{ e.preventDefault(); unlockAudio(); if(!keys[k])PRESSED[k]=true; keys[k]=true; };
    const up=e=>{ e.preventDefault(); keys[k]=false; };
    el.addEventListener("touchstart",down,{passive:false});
    el.addEventListener("touchend",up,{passive:false});
    el.addEventListener("touchcancel",up,{passive:false});
    el.addEventListener("mousedown",down); el.addEventListener("mouseup",up); el.addEventListener("mouseleave",up);
  });
})();

(async()=>{ await load(); if(S.party.length&&S.flags.seenPrologue) S.scene="world"; refreshSnd(); loop(); })();
</script>
</body>
</html>
