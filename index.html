<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONTROL QUEST — Compliance Version</title>
<style>
  :root{
    --ink:#e8ecf4; --dim:#7b8494; --edge:#1b1f27;
    --bg0:#05070b; --bg1:#0c1119; --accent:#f0b429;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg0)}
  body{
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, #131a26 0%, #080b11 60%, #04060a 100%);
  }
  #wrap{ position:relative; line-height:0; }
  canvas#screen{
    display:block; image-rendering:pixelated;
    box-shadow:0 0 60px rgba(90,140,220,.10), 0 0 140px rgba(40,70,130,.14),
               0 18px 60px rgba(0,0,0,.7);
    border-radius:3px;
  }
  /* CRT scanlines + phosphor bloom, toggleable */
  #crt{
    position:absolute; inset:0; pointer-events:none; border-radius:3px;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px,
      rgba(255,255,255,.015) 1px, rgba(255,255,255,.015) 3px);
    mix-blend-mode:multiply; opacity:1; transition:opacity .2s;
  }
  #crt.off{opacity:0}
  #vig{
    position:absolute; inset:0; pointer-events:none; border-radius:3px;
    background:radial-gradient(ellipse 92% 88% at 50% 50%,
      rgba(0,0,0,0) 55%, rgba(0,0,0,.34) 100%);
  }
  /* top-right utility bar */
  #bar{
    position:fixed; top:10px; right:12px; display:flex; gap:6px; z-index:20;
  }
  #bar button{
    font:inherit; font-size:10px; letter-spacing:.1em; color:var(--dim);
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
    border-radius:5px; padding:6px 9px; cursor:pointer; transition:.15s;
  }
  #bar button:hover,#bar button:focus-visible{ color:var(--ink); border-color:rgba(255,255,255,.25); }
  #bar button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #keys{
    position:fixed; bottom:9px; left:0; right:0; text-align:center;
    font-size:9.5px; letter-spacing:.12em; color:#5a6270; z-index:20;
  }
  #keys b{color:#8f98a8;font-weight:400}
  /* touch controls, shown only on coarse pointers */
  #touch{ display:none; position:fixed; inset:0; z-index:15; pointer-events:none; }
  #touch .pad,#touch .btns{ position:absolute; bottom:22px; pointer-events:auto; }
  #touch .pad{ left:18px; width:132px; height:132px; }
  #touch .btns{ right:18px; display:flex; gap:12px; align-items:flex-end; }
  #touch i{
    position:absolute; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
    color:#aeb6c4; font-style:normal; font-size:15px; border-radius:9px;
    -webkit-tap-highlight-color:transparent;
  }
  #touch i:active{ background:rgba(240,180,41,.28); }
  #touch .pad i{ width:44px; height:44px; }
  #touch .u{left:44px;top:0} #touch .d{left:44px;top:88px}
  #touch .l{left:0;top:44px} #touch .r{left:88px;top:44px}
  #touch .btns i{ position:relative; width:54px; height:54px; border-radius:50%; font-size:13px; letter-spacing:.05em; }
  #touch .mn{ width:44px;height:30px;border-radius:8px;font-size:9px; }
  @media (pointer:coarse){ #touch{display:block} #keys{display:none} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="screen" width="160" height="144"></canvas>
    <div id="crt"></div><div id="vig"></div>
  </div>
</div>
<div id="bar">
  <button id="btnSnd" title="Toggle sound">SOUND OFF</button>
  <button id="btnCrt" title="Toggle scanlines">SCANLINES</button>
  <button id="btnFs" title="Fullscreen">FULLSCREEN</button>
</div>
<div id="keys"><b>WASD/ARROWS</b> move &nbsp;·&nbsp; <b>Z</b> confirm &nbsp;·&nbsp; <b>X</b> back &nbsp;·&nbsp; <b>ENTER</b> menu &nbsp;·&nbsp; <b>M</b> map &nbsp;·&nbsp; <b>F</b> fullscreen</div>
<div id="touch">
  <div class="pad"><i class="u" data-k="up">▲</i><i class="d" data-k="down">▼</i><i class="l" data-k="left">◀</i><i class="r" data-k="right">▶</i></div>
  <div class="btns"><i class="mn" data-k="map">MAP</i><i class="mn" data-k="menu">MENU</i><i data-k="back">B</i><i data-k="ok">A</i></div>
</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   CONTROL QUEST — a GRC training RPG in the shape of a 1996 handheld.
   Original characters and world. Style homage only.
   ══════════════════════════════════════════════════════════════════ */

const W=160,H=144,TS=16;
const cvs=document.getElementById("screen"), ctx=cvs.getContext("2d");
ctx.imageSmoothingEnabled=false;

/* ══ PALETTE BANKS ═══════════════════════════════════════════════════
   Art is drawn with 4 indices (0 darkest .. 3 lightest), exactly like
   the DMG. Each draw call selects a bank, which maps those 4 indices to
   real colours. This is how the Game Boy Color did it, and it means the
   whole tile and sprite library gets colour with no repainting.
   ═══════════════════════════════════════════════════════════════════ */
const BANK={};
let _pi=0;
function bank(name,c0,c1,c2,c3){ BANK[name]=_pi++; PALS.push([c0,c1,c2,c3]); return BANK[name]; }
const PALS=[];

/* environment */
bank("floor",  "#1b2436","#2c3a56","#46597e","#5d7299");
bank("carpet", "#2a1f3a","#3d2f52","#54426e","#6b558a");
bank("wall",   "#151b28","#232c3f","#33405a","#46567a");

/* characters */
bank("hero",   "#1a1020","#8c2f3a","#e0644f","#f4d9b0");

/* findings: hostile reds and sickly greens */

/* UI */
bank("ui",     "#10151f","#33405a","#c8d4e6","#f2f6fc");

bank("sky",    "#0a1020","#1c2c50","#38508c","#6a86c8");

let curPal=BANK.ui;
function usePal(p){ curPal=(typeof p==="string")?BANK[p]:p; }

const img=ctx.createImageData(W,H);
const buf=new Uint8Array(W*H);   // (palette<<2)|colorIndex

function clear(c,p){ buf.fill((((p===undefined?curPal:(typeof p==="string"?BANK[p]:p)))<<2)|c); }
function px(x,y,c){ x|=0; y|=0; if(x<0||y<0||x>=W||y>=H)return; buf[y*W+x]=(curPal<<2)|c; }
function rect(x,y,w,h,c){ for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c); }
function frame(x,y,w,h,c){ rect(x,y,w,1,c);rect(x,y+h-1,w,1,c);rect(x,y,1,h,c);rect(x+w-1,y,1,h,c); }

const RGB=[];
function bakePalettes(){
  RGB.length=0;
  for(const p of PALS){
    const row=[];
    for(const hex of p) row.push([parseInt(hex.substr(1,2),16),
                                  parseInt(hex.substr(3,2),16),
                                  parseInt(hex.substr(5,2),16)]);
    RGB.push(row);
  }
}
function flush(){
  if(!RGB.length) bakePalettes();
  const d=img.data;
  for(let i=0;i<buf.length;i++){
    const b=buf[i], c=RGB[b>>2][b&3], o=i*4;
    d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
  }
  ctx.putImageData(img,0,0);
}

function chw(ch){ return 6; }
function text(s,x,y,c){
  c=(c===undefined)?0:c;
  let cx=x;
  for(const ch of String(s)){
    const g=F[ch]||F["?"];
    for(let j=0;j<7;j++) for(let i=0;i<5;i++) if(g[j][i]==="#") px(cx+i,y+j,c);
    cx+=6;
  }
  return cx;
}
function textw(s){ return String(s).length*6; }
function wrap(s,maxCh){
  const out=[];
  for(const para of String(s).split("\n")){
    let ln="";
    for(const w of para.split(" ")){
      if(ln && (ln+" "+w).length>maxCh){ out.push(ln); ln=w; }
      else ln = ln?ln+" "+w:w;
    }
    out.push(ln);
  }
  return out;
}
function ctext(s,y,c,x0,w0){
  x0=x0===undefined?0:x0; w0=w0===undefined?W:w0;
  text(s, x0+Math.floor((w0-textw(s))/2), y, c);
}

/* ── Art: 16x16 tiles. ' '=3 light, '.'=2, ':'=1, '#'=0 dark, 't'=clear ── */

function art(rows){ return rows.map(r=>[...r].map(c=>CMAP[c])); }

/* ══ AUDIO ══════════════════════════════════════════════════════════
   Two pulse voices, a triangle bass and a noise channel, which is
   roughly the Game Boy's voice allocation. Everything is synthesised
   at runtime; there are no audio files to load or host.
   ═══════════════════════════════════════════════════════════════════ */
const SND={ctx:null, master:null, on:true, ready:false,
  track:null, next:0, step:0, timer:null};

function audioInit(){
  if(SND.ctx) { if(SND.ctx.state==="suspended") SND.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  SND.ctx=new AC();
  SND.master=SND.ctx.createGain();
  SND.master.gain.value=SND.on?0.16:0;
  SND.master.connect(SND.ctx.destination);
  SND.ready=true;
  if(SND.pending){ const t=SND.pending; SND.pending=null; music(t); }
}
function audioToggle(){
  SND.on=!SND.on;
  if(SND.master) SND.master.gain.setTargetAtTime(SND.on?0.16:0, SND.ctx.currentTime, 0.02);
  return SND.on;
}
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

/* one pulse/triangle note */
function tone(midi,t0,dur,wave,vol,slide){
  if(!SND.ready) return;
  const c=SND.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=wave||"square";
  const f=mtof(midi);
  o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(mtof(midi+slide), t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(SND.master);
  o.start(t0); o.stop(t0+dur+0.02);
}
/* noise burst for percussion and impacts */
function noise(t0,dur,vol,hp){
  if(!SND.ready) return;
  const c=SND.ctx, n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,Math.max(1,n),c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const g=c.createGain(); g.gain.value=vol||0.1;
  const f=c.createBiquadFilter(); f.type=hp?"highpass":"lowpass"; f.frequency.value=hp||2200;
  src.connect(f); f.connect(g); g.connect(SND.master);
  src.start(t0); src.stop(t0+dur+0.02);
}

function sfx(name){
  if(!SND.ready||!SND.on) return;

  if(name==="text"||name==="page"){ if(now-_lastSfx<0.028) return; _lastSfx=now; }
  f(now+0.001);
}

let _queued=null;
function music(name){
  if(!SND.ready){ SND.pending=name; return; }
  if(SND.trackName===name) return;
  SND.trackName=name;
  SND.track=TRACKS[name]||null;
  SND.step=0;
  SND.next=SND.ctx.currentTime+0.06;
  if(!SND.timer) SND.timer=setInterval(schedule,25);
}
function schedule(){
  if(!SND.ready||!SND.on||!SND.track) return;
  const t=SND.track, spb=60/t.bpm/4;          // sixteenth notes
  const horizon=SND.ctx.currentTime+0.14;
  while(SND.next<horizon){
    const s=SND.step % t.ch[0].n.length;
    for(const c of t.ch){
      const v=c.n[s];
      if(!v) continue;
      if(c.w==="noise") noise(SND.next,0.045,c.v,4000);
      else tone(v,SND.next,spb*(c.w==="triangle"?1.6:1.25),c.w,c.v);
    }
    SND.next+=spb; SND.step++;
    if(t.loop===false && SND.step>=t.ch[0].n.length){
      SND.trackName=null; SND.track=null;
      if(_queued){ const q=_queued; _queued=null; setTimeout(()=>music(q),20); }
      break;
    }
  }
}
function musicThen(short,back){ _queued=back; music(short); }

const PRESSED={};
addEventListener("keydown",e=>{
  const k=norm(e.key); if(!k)return; e.preventDefault();
  if(!keys[k]) PRESSED[k]=true; keys[k]=true;
});
addEventListener("keyup",e=>{ const k=norm(e.key); if(k){keys[k]=false;} });
function norm(k){
  k=k.toLowerCase();
  if(k==="arrowup"||k==="w")return"up";
  if(k==="arrowdown"||k==="s")return"down";
  if(k==="arrowleft"||k==="a")return"left";
  if(k==="arrowright"||k==="d")return"right";
  if(k==="z"||k===" ")return"ok";
  if(k==="x"||k==="escape"||k==="backspace")return"back";
  if(k==="enter")return"menu";
  if(k==="m")return"map";
  return null;
}
function hit(k){ if(PRESSED[k]){PRESSED[k]=false;return true;} return false; }

function story(cards,onDone){
  music("story");
  const pages=[];
  for(const c of cards){
    const avail=c.title?96:104;      // pixels between header and footer rule
    let cur=[], h=0, first=true;
    for(const raw of c.lines){
      const chunk = raw==="" ? [""] : wrap(raw,24);
      for(const ln of chunk){
        const lh = ln==="" ? 6 : 11;
        if(h+lh>avail && cur.length){
          pages.push({title:first?c.title:null,pal:c.pal,lines:cur});
          cur=[]; h=0; first=false;
          if(ln==="") continue;      // don't lead a page with a blank
        }
        cur.push(ln); h+=lh;
      }
    }
    if(cur.length) pages.push({title:first?c.title:null,pal:c.pal,lines:cur});
    // orphan control: never end a card on a single dangling line
    if(pages.length>=2){
      const last=pages[pages.length-1], prev=pages[pages.length-2];
      if(last.lines.length===1 && prev.lines.length>3 && prev.pal===last.pal){
        last.lines.unshift(prev.lines.pop());
        if(prev.lines[prev.lines.length-1]==="") prev.lines.pop();
      }
    }
  }
  S.cut={cards:pages,i:0,ch:0,done:false,onDone:onDone||null};
  S.scene="story"; clearPressed();
}

  const c=S.cut.cards[S.cut.i];
  const total=c.lines.join("").length;
  if(!S.cut.done){
    const b4=S.cut.ch;
    S.cut.ch+=keys.ok?4:1;
    if(S.cut.ch>b4) sfx("text");
    if(S.cut.ch>=total){S.cut.ch=total;S.cut.done=true;}
  } else if(hit("ok")||hit("back")){
    sfx("page");
    S.cut.i++; S.cut.ch=0; S.cut.done=false;
    if(S.cut.i>=S.cut.cards.length){
      const cb=S.cut.onDone; S.cut=null; S.scene="world"; music("world");
      if(cb) cb();
    }
  }
}
function unlock(key){ if(!S.journal.includes(key)) S.journal.push(key); }
function beat(fid,then){
  const b=BEATS[fid];
  unlock(fid);
  if(!b){ if(then)then(); return; }
  story([{title:b.title,pal:b.pal,lines:b.lines}],then);
}
function notice(t){ S.notice=t; S.noticeT=110; }

/* ══ WORLD ══════════════════════════════════════════════════════════ */
function updWorld(){
  if(S.bumped>0)S.bumped--;
  if(hit("map")){ sfx("confirm"); S.mapFrom="world"; S.scene="map"; return; }
  if(hit("menu")){ sfx("confirm"); S.scene="menu"; S.menuIdx=0; return; }
  if(S.walking){
    S.step+=2; const d=S.step;
    if(S.dir==="up")S.oy=-d; if(S.dir==="down")S.oy=d;
    if(S.dir==="left")S.ox=-d; if(S.dir==="right")S.ox=d;
    S.anim=(S.step>4&&S.step<13)?1:0;
    if(S.step>=16){
      S.walking=false; S.step=0; S.ox=0; S.oy=0; S.anim=0;
      if(S.dir==="up")S.ty--; if(S.dir==="down")S.ty++;
      if(S.dir==="left")S.tx--; if(S.dir==="right")S.tx++;
      arrive();
    }
    return;
  }
  if(hit("ok")){ interact(); return; }
  let d=null;
  if(keys.up)d="up"; else if(keys.down)d="down";
  else if(keys.left)d="left"; else if(keys.right)d="right";
  if(d){
    S.dir=d;
    const n=step(S.tx,S.ty,d);
    if(!solidAt(n.x,n.y)) S.walking=true;
    else if(!S.bumped){ sfx("bump"); S.bumped=6; }
  }
}
function step(x,y,d){
  if(d==="up")return{x,y:y-1}; if(d==="down")return{x,y:y+1};
  if(d==="left")return{x:x-1,y}; return{x:x+1,y};
}
function arrive(){
  const m=mp();
  const dr=(m.doors||[]).find(d=>d.x===S.tx&&d.y===S.ty);
  if(dr){ sfx("door"); S.map=dr.to; S.tx=dr.tx; S.ty=dr.ty; S.seen[dr.to]=true; notice(MAPS[S.map].name); save(); return; }
  if(m.lift&&m.lift.x===S.tx&&m.lift.y===S.ty){ tryLift(); return; }
  const e=encAt(S.tx,S.ty);
  if(e){ sfx("encounter"); setTimeout(()=>{},0); startBattle(e.f); }
}
function interact(){
  const n=step(S.tx,S.ty,S.dir);
  const npc=npcAt(n.x,n.y);
  if(npc){ talkTo(npc); return; }
  const t=TKEY[tileAt(n.x,n.y)];
  if(t==="term"){ termUse(); return; }
  else if(t==="board") say([["WHITEBOARD","EVIDENCE = artifact + date + who produced it. Anything\nless is an anecdote."]]);
  else if(t==="rack") say([["RACK","Fans, dust, and a label maker nobody has used since 2019."]]);
  else if(t==="cabinet") say([["CABINET","Binders of policies. Last reviewed: unclear."]]);
  else if(t==="boxes") say([["BOXES","Asset tags on none of them. CIS 1.1 would like a word."]]);
  else if(t==="lift") tryLift();
}
function talkTo(npc){
  npc.face=opposite(S.dir);
  if(npc.kind==="giver"&&!S.flags["gave_"+npc.gives]){
    if(S.register.length<(npc.need||0)){ say(npc.locked||npc.lines); return; }
    say(npc.lines,()=>{
      S.flags["gave_"+npc.gives]=true;
      addControl(npc.gives);
      const c=CONTROLS[npc.gives];
      say([["",c.name+" joined your party!"],
           ["",c.name+" is a "+c.type+" control. CIS "+c.cis.join(", ")+"."],
           ["","Findings weak to "+c.type+" take double from Test and\nRemediate."]]);
    });
    return;
  }
  if(npc.kind==="heal"&&S.party.length&&S.flags["met_"+npc.name]){
    const hurt=S.party.some(p=>p.hp<p.max);
    S.party.forEach(p=>p.hp=p.max);
    say(hurt?[["MARGIT","You look rough. Sit. Coffee's terrible but it's free."],
              ["","Your CONTROLS were restored to full."]]
            :[["MARGIT","Queue's at "+(50-clearedCount()*9)+". Go on."]]);
    return;
  }
  const done=npc.kind==="giver"?S.flags["gave_"+npc.gives]:S.flags["met_"+npc.name];
  S.flags["met_"+npc.name]=true;
  say(done&&npc.after?npc.after:npc.lines);
}
function opposite(d){ return {up:"down",down:"up",left:"right",right:"left"}[d]; }

function clearedCount(){
  return ["SHAREDPASS","SHADOWIT","NOLOGS","STALEACCT","OPENPORT"].filter(f=>S.cleared[f]).length;
}
function termUse(){
  if(S.map==="closet"){
    say([["TERMINAL","> grep -c . /var/log/audit.log\n0","Two years of nothing."]]);
    return;
  }
  if(S.cleared.TICKETSTORM){
    say([["TERMINAL","> tail -f queue.log\n3 open. All different.\n> _"]]);
    return;
  }
  const got=clearedCount();
  if(got>=3){
    say([["TERMINAL","> tail -f queue.log\n50 open. Same ticket.\n> trace --root-cause"],
         ["TERMINAL","Something is generating them. It is still running."]],()=>startBattle("TICKETSTORM"));
  } else {
    say([["TERMINAL","> tail -f queue.log\n50 open. 50 identical.","Root cause trace needs "+(3-got)+" more logged finding(s)."]]);
  }
}
function tryLift(){
  const got=clearedCount();
  if(!S.cleared.TICKETSTORM){
    sfx("deny");
    if(got>=3) say([["LIFT","LOCKED. Root cause still running. Terminal, desk floor."]]);
    else say([["LIFT","LOCKED. Log "+(3-got)+" more finding(s) to trace the root cause."]]);
    return;
  }
  if(S.flags.ending){ say([["LIFT","Act 2: THE DOMAIN is not built yet. That part is yours - the README says how."]]); return; }
  S.flags.ending=true; unlock("end"); S.act=1;
  const cards=ENDING.map(c=>({pal:c.pal,lines:c.lines.slice()}));
  const last=cards[cards.length-1].lines;
  last[last.length-1]="ACT 1 COMPLETE - Day "+S.day+" of 90";
  story(cards,()=>{
    say([["","Findings logged: "+S.register.length+".  Evidence on file: "+S.evidence.length+"."],
         ["","Open the menu and choose EXPORT. Take the register and the POA&M with you."]]);
  });
}

/* ══ PARTY / REGISTER ═══════════════════════════════════════════════ */
function addControl(id){
  const c=CONTROLS[id];
  S.party.push({id,name:c.name,type:c.type,lvl:1,hp:c.hp,max:c.hp,atk:c.atk,
    moves:c.moves.slice(),xp:0});
}
function alive(){ return S.party.filter(p=>p.hp>0); }
function rating(n){ return n>=15?"CRITICAL":n>=10?"HIGH":n>=5?"MODERATE":"LOW"; }
function today(){ const d=new Date(); d.setDate(d.getDate()+S.day-1); return d.toISOString().slice(0,10); }
function dueIn(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

function logFinding(fid,evCount,treatment){
  const f=FINDINGS[fid];
  const inherent=f.lik*f.imp;
  const reduction=Math.min(0.75,evCount*0.18);
  const residual=(treatment==="ACCEPTED")?inherent:Math.max(1,Math.round(inherent*(1-reduction)));
  const entry={
    id:"R-"+String(S.register.length+1).padStart(3,"0"),
    finding:f.name, cis:f.cis, csf:f.csf,
    lik:f.lik, imp:f.imp, inherent, residual,
    treatment, owner:"IT Operations", opened:today(), due:dueIn(30),
    status:(treatment==="ACCEPTED")?"Accepted":"Remediation in progress",
    fix:f.fix, evidence:f.ev, evCount
  };
  S.register.push(entry);
  S.evidence.push({name:f.ev,ctrl:f.cis,date:today(),age:0});
  S.cleared[fid]=true;
  return entry;
}

/* ══ BATTLE ═════════════════════════════════════════════════════════ */
function startBattle(fid){
  if(!S.party.length){ say([["","You have no CONTROLS. Talk to DEV at the desk\nfloor first."]]); return; }
  const f=FINDINGS[fid];
  const act=alive()[0];
  S.battle={fid,f,hp:f.hp,max:f.hp,atk:f.atk,ev:0,me:act,
    phase:"intro",menu:0,log:[],shake:0,flash:0,turn:0};
  S.scene="battle"; clearPressed();
  music(f.boss?"boss":"battle");
  bmsg("A wild "+f.name+" appeared! "+f.intro);
}
function bmsg(t,then){ const b=S.battle; b.text=t; b.ch=0; b.tdone=false; b.then=then||null; b.phase="msg"; }

function dmgCalc(mv,me,b){
  const M=MOVES[mv]; let d=M.pow;
  const weakHit=(me.type===b.f.weak);
  if(M.kind==="test") d=M.pow+b.ev*5;
  if(M.kind==="attest") d=(b.ev>=3)?M.pow+8:Math.max(2,Math.round(M.pow/3));
  if(M.kind==="document") d=M.pow;
  if(M.kind==="evidence") d=M.pow;
  d=Math.round(d*(1+(me.lvl-1)*0.15));
  if(weakHit&&(M.kind==="test"||M.kind==="remediate"||M.kind==="attest")) d=Math.round(d*2);
  return {d,weakHit};
}

function doMove(mv){
  const b=S.battle, me=b.me, M=MOVES[mv];
  if(M.kind==="remediate"&&S.budget<M.cost){
    bmsg("Not enough budget. Remediation costs "+M.cost+".",()=>b.phase="menu"); return;
  }
  let lines=[];
  if(M.kind==="remediate") S.budget-=M.cost;
  if(M.kind==="evidence"){ b.ev++; }
  const {d,weakHit}=dmgCalc(mv,me,b);
  b.hp=Math.max(0,b.hp-d);
  b.flash=8;
  sfx(M.kind==="evidence"?"collect":(weakHit?"crit":"hit"));
  if(M.kind==="evidence") lines.push(me.name+" collected evidence. Evidence on hand: "+b.ev);
  else if(M.kind==="test") lines.push(me.name+" tested the control. "+(b.ev===0?"No evidence. Weak result.":"Evidence backed it up."));
  else if(M.kind==="attest") lines.push(b.ev>=3?me.name+" attested. It held.":me.name+" attested with thin evidence. It did not hold.");
  else if(M.kind==="remediate") lines.push(me.name+" remediated the gap. Budget left: "+S.budget);
  else if(M.kind==="document"){ b.atk=Math.max(3,b.atk-2); lines.push(me.name+" wrote policy. "+b.f.name+" hits softer now."); }
  if(weakHit&&M.kind!=="evidence"&&M.kind!=="document") lines.push("The right control for the job.");

  bmsg(lines.join(" "),()=>{
    if(b.hp<=0){ winBattle(); return; }
    enemyTurn();
  });
}
function enemyTurn(){
  const b=S.battle, me=b.me;
  const d=Math.max(1,Math.round(b.atk*(0.8+Math.random()*0.5)));
  me.hp=Math.max(0,me.hp-d);
  b.shake=10;
  sfx("hurt");
  bmsg(b.f.name+" exploits the gap! "+me.name+" took "+d+" damage.",()=>{
    if(me.hp<=0){
      const rest=alive();
      if(rest.length){ sfx("faint"); b.me=rest[0]; bmsg(me.name+" is overwhelmed. "+rest[0].name+" steps up!",()=>b.phase="menu"); }
      else loseBattle();
    } else b.phase="menu";
  });
}
function winBattle(){
  const b=S.battle;
  b.me.xp+=10; 
  let lvlup=false;
  if(b.me.xp>=20*b.me.lvl){ b.me.lvl++; b.me.max+=6; b.me.hp=b.me.max; b.me.atk+=2; lvlup=true; setTimeout(()=>sfx("levelup"),700); }
  const entry=logFinding(b.fid,b.ev,"MITIGATED");
  musicThen("win","world"); sfx("logged");
  S.budget=Math.min(12,S.budget+2);
  const msg=[
    b.f.name+" was logged. RISK "+entry.id+" opened.",
    "Inherent "+entry.inherent+" ("+rating(entry.inherent)+") Residual "+entry.residual+" ("+rating(entry.residual)+") Evidence items: "+b.ev,
    (b.ev===0?"You logged it with zero evidence. An auditor will\nreopen this.":"Evidence filed under CIS "+b.f.cis+"."),
    (lvlup?b.me.name+" reached maturity "+b.me.lvl+"!":"Budget +2.")
  ];
  b.phase="msg"; b.queue=msg.slice(1); bmsg(msg[0],()=>nextWinMsg());
}
function nextWinMsg(){
  const b=S.battle;
  if(b.queue&&b.queue.length){ bmsg(b.queue.shift(),()=>nextWinMsg()); return; }
  const fid=b.fid;
  S.battle=null; S.scene="world"; save();
  beat(fid,()=>afterBeat(fid));
  return;
}
function afterBeat(fid){
  if(S.cleared.SHAREDPASS&&S.cleared.NOLOGS&&S.cleared.STALEACCT&&!S.flags.mid){
    S.flags.mid=true;
    say([["MARGIT","Three logged. Queue's down to twelve."],["MARGIT","Now go kill the thing making the tickets. Terminal, desk\nfloor."]]);
  }
}
function loseBattle(){
  const b=S.battle;
  sfx("faint"); music("world");
  bmsg("The finding stands. You withdraw to write it up.",()=>{
    S.party.forEach(p=>p.hp=Math.max(1,Math.round(p.max*0.5)));
    S.battle=null; S.scene="world"; S.day++;
    say([["","You take the loss and go home. The finding is still open."],
         ["","Tip: COLLECT evidence before you TEST. Damage scales with\nwhat you can prove."]]);
  });
}

function updBattle(){
  const b=S.battle;

  if(b.menu!==m0) sfx("cursor");
  if(hit("ok")){ sfx("confirm"); doMove(b.me.moves[b.menu]); }

function drawList(title,rows,idx,scroll,perPage){
  clear(0,"ui"); usePal("ui");
  rect(0,0,W,12,1); usePal("uiwarn"); text(title,4,3,3);

/* ══ EXPORT — the part that makes this a portfolio piece ════════════ */
function ratePal(n){ return n>=15?"uibad":n>=10?"uiwarn":n>=5?"ACCESS":"uigood"; }
function csvEsc(s){ s=String(s); return /[", ]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function buildCSV(){
  const NL=String.fromCharCode(13)+String.fromCharCode(10);
  const head=["Risk ID","Finding","CIS v8 Safeguard","NIST CSF 2.0 Function","Likelihood (1-5)",
    "Impact (1-5)","Inherent Score","Inherent Rating","Residual Score","Residual Rating",
    "Treatment","Owner","Date Opened","Due Date","Status","Evidence Required","Evidence Count"];
  const rows=S.register.map(r=>[r.id,r.finding,r.cis,r.csf,r.lik,r.imp,r.inherent,
    rating(r.inherent),r.residual,rating(r.residual),r.treatment,r.owner,r.opened,r.due,
    r.status,r.evidence,r.evCount]);
  return [head,...rows].map(r=>r.map(csvEsc).join(",")).join(NL);
}
function buildPOAM(){
  const N=String.fromCharCode(10), NN=N+N, BR="  "+N;
  const d=new Date().toISOString().slice(0,10);
  const L=[];
  L.push("# Plan of Action and Milestones (POA&M)"+N);
  L.push("**System:** Sublevel 2 Helpdesk Environment"+BR);
  L.push("**Framework:** CIS Controls v8 (IG1) mapped to NIST CSF 2.0"+BR);
  L.push("**Assessment date:** "+d+BR);
  L.push("**Prepared by:** GRC Analyst (self-assessment)"+NN);
  L.push("> Generated from CONTROL QUEST game state. Safeguard numbering must be"+N);
  L.push("> verified against the published CIS Controls v8 document before use."+NN);
  L.push("## Summary"+NN);
  const crit=S.register.filter(r=>rating(r.residual)==="CRITICAL").length;
  const high=S.register.filter(r=>rating(r.residual)==="HIGH").length;
  const noEv=S.register.filter(r=>r.evCount===0).length;
  L.push("- Findings identified: **"+S.register.length+"**"+N);
  L.push("- Residual CRITICAL: **"+crit+"** / Residual HIGH: **"+high+"**"+N);
  L.push("- Evidence artifacts on file: **"+S.evidence.length+"**"+N);
  L.push("- Findings logged without evidence: **"+noEv+"**"+NN);
  L.push("## Register"+NN);
  L.push("| ID | Finding | CIS | CSF | Inherent | Residual | Due |"+N);
  L.push("|---|---|---|---|---|---|---|"+N);
  S.register.forEach(r=>{
    L.push("| "+r.id+" | "+r.finding+" | "+r.cis+" | "+r.csf+" | "+r.inherent+" "+rating(r.inherent)+" | "+r.residual+" "+rating(r.residual)+" | "+r.due+" |"+N);
  });
  L.push(N+"## Open items"+NN);
  S.register.forEach(r=>{
    L.push("### "+r.id+" - "+r.finding+NN);
    L.push("| Field | Value |"+N+"|---|---|"+N);
    L.push("| CIS v8 safeguard | "+r.cis+" |"+N);
    L.push("| NIST CSF 2.0 function | "+r.csf+" |"+N);
    L.push("| Likelihood / Impact | "+r.lik+" / "+r.imp+" |"+N);
    L.push("| Inherent risk | "+r.inherent+" ("+rating(r.inherent)+") |"+N);
    L.push("| Residual risk | "+r.residual+" ("+rating(r.residual)+") |"+N);
    L.push("| Treatment | "+r.treatment+" |"+N);
    L.push("| Owner | "+r.owner+" |"+N);
    L.push("| Opened | "+r.opened+" |"+N);
    L.push("| Due | "+r.due+" |"+N);
    L.push("| Status | "+r.status+" |"+NN);
    L.push("**Remediation plan.** "+r.fix+NN);
    L.push("**Evidence required.** "+r.evidence+NN);
    if(r.evCount===0) L.push("> Logged without supporting evidence. Treat as unverified."+NN);
  });
  return L.join("");
}
function download(name,text){
  try{
    const b=new Blob([text],{type:"text/plain;charset=utf-8"});
    const u=URL.createObjectURL(b);
    const a=document.createElement("a"); a.href=u; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},2000);
    return true;
  }catch(e){ return false; }
}
function doExport(){
  if(!S.register.length){ say([["","Nothing to export yet. Log a finding first."]]); return; }
  const ok1=download("risk-register.csv",buildCSV());
  const ok2=download("poam.md",buildPOAM());
  S.scene="world";
  if(ok1&&ok2) say([["EXPORT","risk-register.csv poam.md"],
    ["EXPORT","Two real artifacts, built from what you actually proved.\nThat is the deliverable."]]);
  else say([["EXPORT","Download blocked here. Open the file outside the\nsandbox to export."]]);
}

function update(){

  switch(S.scene){
    case "title": updTitle(); break;
    case "world": updWorld(); break;
    case "dialog": updMsg(); break;
    case "story": updStory(); break;
    case "menu": updMenu(); break;
    case "battle": updBattle(); break;
    case "map": updMap(); break;
    case "journal": updJournal(); break;
    case "register": updRegister(); break;
    case "regdetail": updRegDetail(); break;
    case "controls": updControls(); break;
    case "evidence": updEvidence(); break;
    case "status": updStatus(); break;
  }
  clearPressed();
}
function draw(){
  switch(S.scene){
    case "title": drawTitle(); break;
    case "world": drawWorld(); break;
    case "dialog": drawWorld(); drawMsg(); break;
    case "story": drawStory(); break;
    case "menu": drawMenu(); break;
    case "battle": drawBattle(); break;
    case "map": drawMap(); break;
    case "journal": drawJournal(); break;
    case "register": drawRegister(); break;
    case "regdetail": drawRegDetail(); break;
    case "controls": drawControls(); break;
    case "evidence": drawEvidence(); break;
    case "status": drawStatus(); break;
  }
  flush();
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }

/* ── viewport: fill the window, letterboxed, integer scale where it fits ── */
function fit(){
  const pad = (matchMedia("(pointer:coarse)").matches) ? 8 : 24;
  const availW = window.innerWidth - pad*2;
  const availH = window.innerHeight - (matchMedia("(pointer:coarse)").matches ? 16 : 70);
  const raw = Math.min(availW/W, availH/H);
  const s = raw >= 2 ? Math.floor(raw) : Math.max(1, raw);
  cvs.style.width = Math.round(W*s)+"px";
  cvs.style.height = Math.round(H*s)+"px";
}
addEventListener("resize",fit); addEventListener("orientationchange",()=>setTimeout(fit,120)); fit();

/* ── fullscreen + scanlines ── */
const crtEl=document.getElementById("crt");
function toggleCrt(){ crtEl.classList.toggle("off"); }
function toggleFs(){
  const el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el); }
  else { (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document); }
  setTimeout(fit,180);
}
const btnSnd=document.getElementById("btnSnd");
btnSnd.onclick=()=>{ audioInit(); btnSnd.textContent = audioToggle()? "SOUND ON":"SOUND OFF"; };
document.getElementById("btnCrt").onclick=toggleCrt;
document.getElementById("btnFs").onclick=toggleFs;
document.addEventListener("fullscreenchange",()=>setTimeout(fit,180));
addEventListener("keydown",e=>{
  audioInit();
  const k=e.key.toLowerCase();
  if(k==="f"){ e.preventDefault(); toggleFs(); }
  if(k==="c"){ e.preventDefault(); toggleCrt(); }
});
addEventListener("pointerdown",audioInit,{once:false});

/* ── touch controls ── */
(function(){
  const held={};
  document.querySelectorAll("#touch i").forEach(el=>{
    const k=el.dataset.k;
    const down=e=>{ e.preventDefault(); audioInit(); if(!keys[k])PRESSED[k]=true; keys[k]=true; held[k]=true; };
    const up=e=>{ e.preventDefault(); keys[k]=false; held[k]=false; };
    el.addEventListener("touchstart",down,{passive:false});
    el.addEventListener("touchend",up,{passive:false});
    el.addEventListener("touchcancel",up,{passive:false});
    el.addEventListener("mousedown",down); el.addEventListener("mouseup",up);
    el.addEventListener("mouseleave",up);
  });
})();

(async()=>{ await load(); if(S.party.length) S.scene="world"; loop(); })();
